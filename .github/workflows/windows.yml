name: Build Minova Cloud Desktop
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: minova-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build pull request preview
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: ./Build-Minova-Cloud.ps1 -DotNet (Get-Command dotnet).Source -UnsignedPreview
      - name: Build Windows app and signed update manifest
        if: github.event_name != 'pull_request'
        env:
          MINOVA_UPDATE_SIGNING_KEY: ${{ secrets.MINOVA_UPDATE_SIGNING_KEY }}
        shell: pwsh
        run: ./Build-Minova-Cloud.ps1 -DotNet (Get-Command dotnet).Source
      - name: Verify release metadata
        shell: pwsh
        run: |
          $metadata = Get-Content releases/release.json -Raw | ConvertFrom-Json
          $actual = (Get-FileHash releases/Minova-Cloud-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $metadata.sha256) { throw 'Installer checksum does not match release metadata.' }
          if ('${{ github.event_name }}' -ne 'pull_request') {
            $rsa = [Security.Cryptography.RSA]::Create()
            try {
              $rsa.ImportFromPem([IO.File]::ReadAllText('update-public.pem'))
              $signature = [Convert]::FromBase64String([IO.File]::ReadAllText('releases/release.json.sig'))
              if (-not $rsa.VerifyData([IO.File]::ReadAllBytes('releases/release.json'), $signature, [Security.Cryptography.HashAlgorithmName]::SHA256, [Security.Cryptography.RSASignaturePadding]::Pkcs1)) { throw 'Update signature verification failed.' }
            } finally { $rsa.Dispose() }
          }
      - name: Test updater trust and installation safeguards
        shell: pwsh
        run: |
          dotnet build src/Minova.Cloud.Windows -c Debug --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Debug build failed.' }
          dotnet src/Minova.Cloud.Windows/bin/Debug/net10.0-windows10.0.19041.0/Minova.Cloud.dll --update-tests .work/updater-security-report.txt
          if ($LASTEXITCODE -ne 0) { throw 'Updater security checks failed.' }
          Get-Content .work/updater-security-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Minova-Cloud-Desktop-${{ github.sha }}
          path: releases/
          retention-days: 90
      - name: Prepare reviewed-release draft
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-release.mjs
        shell: pwsh
    permissions:
      contents: write
